name: Cloud release build
# One cloud build serves one release.  With publish=true this run builds the candidate, freezes it,
# proves with a disposable key that the frozen tree finalizes end to end, and only then asks for
# production approval to reserve a sequence.  A release therefore costs a single build, and commits
# landing on main afterwards cannot invalidate it because the whole chain binds the dispatched SHA.
# publish=false still exercises the same pipeline without approving, reserving or touching anything.
on:
  pull_request:
    paths: ['.github/**', 'scripts/**', 'tools/**', 'Tests/**', 'Version.props', 'global.json', 'IMao-*/**', 'Assets/**', 'CMakeLists.txt', 'cmake/**', 'patches/**', 'Docs/**', '.gitattributes', '.gitignore', 'LICENSE']
  workflow_dispatch:
    inputs:
      publish:
        description: Reserve a formal release from this run after production approval
        type: boolean
        default: false
      confirm_version:
        description: Exact Version.props version (required when publish=true)
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    # Nothing in this job reads the Actions API any more: the frozen artifact and the rehearsal evidence
    # are uploaded through the runtime token, so checkout is the only scope the build needs.
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.bulk.outputs.artifact-id }}
      artifact_digest: ${{ steps.bulk.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.424
      # Reproducibility evidence: record every toolchain input that decides the
      # bytes, so a rehearsal/formal mismatch can be diagnosed from the logs.
      # Windows SDK servicing keeps the folder name, so record a revision-
      # sensitive stamp as well.  This step must never fail a release.
      - name: Record build toolchain
        continue-on-error: true
        shell: pwsh
        run: |
          $lock = Get-Content .github/dependencies.lock.json -Raw | ConvertFrom-Json
          Write-Host "IMAGE_VERSION=$env:ImageVersion"
          Write-Host "LOCKED_DOTNET_SDK=$($lock.dotnetSdk) LOCKED_MSVC=$($lock.msvc) LOCKED_WINDOWS_SDK=$($lock.windowsSdk)"
          $pathCmake = (Get-Command cmake -ErrorAction SilentlyContinue).Source
          $pathNinja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          Write-Host "PATH_CMAKE=$pathCmake"
          Write-Host "PATH_NINJA=$pathNinja"
          if ($pathCmake) { Write-Host "PATH_CMAKE_VERSION=$(& $pathCmake --version | Select-Object -First 1)" }
          if ($pathNinja) { Write-Host "PATH_NINJA_VERSION=$(& $pathNinja --version)" }
          $dotnetPath = (Get-Command dotnet -ErrorAction SilentlyContinue).Source
          if ($dotnetPath) { Write-Host "DOTNET_SDK=$(& $dotnetPath --version)" }
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { Write-Host 'VSWHERE=missing'; exit 0 }
          $vsArgs = @('-latest', '-products', '*', '-version', '[17.0,18.0)')
          $vs = & $vswhere @vsArgs -property installationPath
          Write-Host "VS=$vs"
          Write-Host "VS_VERSION=$(& $vswhere @vsArgs -property catalog_productDisplayVersion)"
          if (-not $vs) { exit 0 }
          $vsCmake = & $vswhere @vsArgs -find 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe' | Select-Object -First 1
          $vsNinja = & $vswhere @vsArgs -find 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe' | Select-Object -First 1
          Write-Host "VS_CMAKE=$vsCmake"
          if ($vsCmake) { Write-Host "VS_CMAKE_VERSION=$(& $vsCmake --version | Select-Object -First 1)" }
          Write-Host "VS_NINJA=$vsNinja"
          if ($vsNinja) { Write-Host "VS_NINJA_VERSION=$(& $vsNinja --version)" }
          Write-Host "MSVC_TOOLSETS=$((@(Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | Select-Object -ExpandProperty Name) -join ','))"
          Write-Host "VC_REDIST=$((@(Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory -ErrorAction SilentlyContinue | Where-Object Name -match '^\d+\.\d+\.\d+$' | Select-Object -ExpandProperty Name) -join ','))"
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          Write-Host "WINDOWS_SDKS=$((@(Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ','))"
          $winnt = Join-Path $sdkRoot "Include/$($lock.windowsSdk)/um/winnt.h"
          if (Test-Path $winnt) {
            $stamp = Get-Item $winnt
            Write-Host "SDK_WINNT_H=$($stamp.Length):$($stamp.LastWriteTimeUtc.ToString('o'))"
          }
          $sdkLib = Join-Path $sdkRoot "Lib/$($lock.windowsSdk)/um/x64"
          $kernel32 = Join-Path $sdkLib 'kernel32.lib'
          if (Test-Path $sdkLib) {
            $libs = @(Get-ChildItem $sdkLib -File -Filter '*.lib')
            Write-Host "SDK_UM_X64_LIBS=$($libs.Count) SDK_UM_X64_BYTES=$(($libs | Measure-Object Length -Sum).Sum)"
          }
          if (Test-Path $kernel32) {
            $lib = Get-Item $kernel32
            Write-Host "SDK_KERNEL32_STAMP=$($lib.Length):$($lib.LastWriteTimeUtc.ToString('o'))"
          }
      # A release run no longer waits for an earlier rehearsal of the same SHA: the rehearsal below
      # runs inside it, on the very artifact the approval would release.
      - name: Validate formal inputs
        env:
          FORMAL: ${{ inputs.publish || false }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          if ($env:FORMAL -eq 'true') {
            [xml]$v=Get-Content Version.props -Raw
            if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:CONFIRM_VERSION -cne [string]$v.Project.PropertyGroup.IMaoVersion) { throw 'Formal release requires main and exact confirm_version.' }
          }
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: archives
        with:
          path: third_party/downloads
          key: dependency-archives-${{ hashFiles('.github/dependencies.lock.json') }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: third_party/nuget-packages
          key: nuget-dotnet80424-${{ hashFiles('**/*.csproj') }}
      - name: Bootstrap locked native dependencies
        run: ./scripts/Initialize-CiDependencies.ps1
      - name: Save verified archives independently of later build failures
        if: steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: third_party/downloads
          key: ${{ steps.archives.outputs.cache-primary-key }}
      - name: Build, test, package and shard
        id: package
        env:
          FORMAL: ${{ inputs.publish || false }}
        run: |
          ./scripts/New-CiReleaseArtifacts.ps1 -SourceCommit $env:GITHUB_SHA -OutputRoot "$env:GITHUB_WORKSPACE/out/ci-release" -Rehearsal ($env:FORMAL -ne 'true')
      - name: Diagnose cloud build failure
        if: failure()
        run: |
          git status --porcelain=v1 --untracked-files=all
          Get-ChildItem out/ci-release -Filter '*.log' -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName -Tail 30 }
      # The rehearsal below finalizes the prepared tree in place - it writes update.json, rebuilds the offline
      # archive and rewrites release-report.json, which IS part of the frozen artifact.  Assert the invariant
      # rather than trusting step order: a tree that already carries a finalization must never be published.
      - name: Assert the frozen tree is unsigned
        run: |
          $root='out/ci-release/prepared'
          foreach ($stray in 'update.json','release-signing-request.zip','release-authorization.json') {
            if (Test-Path (Join-Path $root $stray)) { throw "Frozen tree already carries $stray; the freeze must precede the rehearsal." }
          }
          $report=Get-Content (Join-Path $root 'release-report.json') -Raw | ConvertFrom-Json
          if ($report.signedManifestSha256 -or $report.requestId -or ($report.offline -and $report.offline.sha256)) { throw 'Frozen tree carries a finalized report; the freeze must precede the rehearsal.' }
      - name: Freeze unsigned release build
        id: bulk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: |
            out/ci-release/prepared/catalog-draft.json
            out/ci-release/prepared/release-report.json
            out/ci-release/prepared/packages
            out/ci-release/prepared/program
            out/ci-release/prepared/manual
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      # Both modes rehearse the frozen tree with a disposable key.  This is the evidence that the exact
      # artifact a release would publish can be finalized and verified end to end, and for a release run
      # it is produced before the production approval is ever requested.
      - name: Full-artifact disposable-key rehearsal
        run: |
          ./scripts/Test-CiReleaseArtifacts.ps1 -PreparedRoot out/ci-release/prepared -ArtifactId ${{ steps.bulk.outputs.artifact-id }} -ArtifactDigest '${{ steps.bulk.outputs.artifact-digest }}' -BuildRunId ${{ github.run_id }}
      - name: Save bounded rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-rehearsal-evidence
          path: |
            out/ci-release/rehearsal/rehearsal-report.json
            out/ci-release/rehearsal/rehearsal-evidence.json
            out/ci-release/publisher-tests/cloud-self-test-report.json
          retention-days: 30
          if-no-files-found: error
      # Whoever approves the production Environment reads this first: it is the only place the exact
      # frozen artifact identity is visible before a sequence is reserved.  Cosmetic, so a failure here
      # must never block a release.
      - name: Summarise the frozen candidate
        continue-on-error: true
        run: |
          $e=Get-Content out/ci-release/rehearsal/rehearsal-evidence.json -Raw | ConvertFrom-Json
          $text=@(
            '### Cloud release candidate'
            ''
            '| field | value |'
            '|---|---|'
            ('| version | ' + $e.appVersion + ' |')
            ('| source commit | ' + $e.sourceCommit + ' |')
            ('| build run | ' + $e.buildRunId + ' |')
            ('| frozen artifact | ' + $e.artifactId + ' |')
            ('| artifact digest | sha256:' + $e.artifactDigest + ' |')
            ('| provisional sequence | ' + $e.provisionalSequence + ' |')
            ('| publish intent | ' + '${{ inputs.publish }}' + ' |')
            ''
            'The disposable-key rehearsal finalized this exact frozen tree. Production approval reserves the real sequence.'
          ) -join "`n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY,$text+"`n",[Text.UTF8Encoding]::new($false))
  prepare:
    needs: build
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'kahvia-d/IMAO' }}
    runs-on: windows-2022
    timeout-minutes: 45
    environment: production
    concurrency:
      group: imao-production-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.424
      - name: Verify and retrieve the frozen build in cloud
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          . ./scripts/CiReleaseMetadata.ps1
          [IO.Directory]::CreateDirectory('out/prepare') | Out-Null
          $a=Get-CiBuildArtifact $env:GITHUB_RUN_ID $env:ARTIFACT_ID $env:GITHUB_SHA -AllowRehearsal
          if ($a.digest -cne 'sha256:'+$env:ARTIFACT_DIGEST) { throw 'Frozen artifact digest differs.' }
          Save-CiArtifactArchive $a.id 'out/prepare/build.zip'
          Assert-CiArtifactDigest 'out/prepare/build.zip' $a.digest
          Expand-Archive out/prepare/build.zip out/prepare/prepared
          Remove-Item out/prepare/build.zip
          dotnet build tools/UpdatePublisher/UpdatePublisher.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Publisher build failed.' }
      - name: Reserve sequence under the publish lock and create request
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          ./scripts/Publish-ResourceUpdate.ps1 -Phase reserve -Publish $true -ConfirmVersion $env:CONFIRM_VERSION -PreparedRoot out/prepare/prepared -RequestRoot out/prepare/request -ArtifactId $env:ARTIFACT_ID -ArtifactDigest $env:ARTIFACT_DIGEST -BuildRunId $env:GITHUB_RUN_ID -Dotnet (Get-Command dotnet).Source
      - name: Reuse the original request after an interrupted job
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Reuse-CiSigningRequest.ps1 -RequestRoot out/prepare/request
      - name: Save ONLY the bounded signing request
        if: steps.original.outputs.reused != 'true'
        id: request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-signing-request
          path: out/prepare/request
          retention-days: 30
          if-no-files-found: error
      - name: Register exact request artifact for the local signer
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          TRANSACTION_ID: ${{ steps.reserve.outputs.transaction_id }}
          REQUEST_ID: ${{ steps.original.outputs.artifact_id || steps.request.outputs.artifact-id }}
          REQUEST_DIGEST: ${{ steps.original.outputs.artifact_digest || steps.request.outputs.artifact-digest }}
        run: |
          ./scripts/Publish-ResourceUpdate.ps1 -Phase register-request -Publish $true -ConfirmVersion $env:CONFIRM_VERSION -PreparedRoot out/prepare/prepared -RequestRoot out/prepare/request -TransactionId $env:TRANSACTION_ID -RequestArtifactId $env:REQUEST_ID -RequestArtifactDigest $env:REQUEST_DIGEST -Dotnet (Get-Command dotnet).Source
