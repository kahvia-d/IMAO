name: One-time encrypted Mirror credential migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'kahvia-d/IMAO' }}
    runs-on: windows-2022
    timeout-minutes: 10
    environment: mirrorchyan
    steps:
      - name: Encrypt for the trusted local recipient
        shell: pwsh
        env:
          UPLOAD_TOKEN: ${{ secrets.MIRRORCHYANUPLOADTOKEN }}
          RECIPIENT_PUBLIC_KEY: ''
          MIGRATION_NONCE: 'dfe085b8b5b24914a224df2bcabea7ad'
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPLOAD_TOKEN)) { throw 'Source upload credential is missing.' }
          $rsa=[Security.Cryptography.RSA]::Create()
          $plain=$null
          try {
            $public=[Convert]::FromBase64String($env:RECIPIENT_PUBLIC_KEY)
            $consumed=0
            $rsa.ImportSubjectPublicKeyInfo($public,[ref]$consumed)
            if ($consumed -ne $public.Length -or $rsa.KeySize -ne 4096) { throw 'Recipient key is invalid.' }
            $payload=@{nonce=$env:MIGRATION_NONCE;token=$env:UPLOAD_TOKEN}|ConvertTo-Json -Compress
            $plain=[Text.Encoding]::UTF8.GetBytes($payload)
            if ($plain.Length -gt 446) { throw 'Credential is too large for this migration envelope.' }
            $cipher=$rsa.Encrypt($plain,[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            $envelope=@{nonce=$env:MIGRATION_NONCE;repository=$env:GITHUB_REPOSITORY;runId=$env:GITHUB_RUN_ID;source=$env:GITHUB_SHA;environment='mirrorchyan';secretName='MIRRORCHYANUPLOADTOKEN';ciphertext=[Convert]::ToBase64String($cipher)}
            [IO.Directory]::CreateDirectory('encrypted-transfer')|Out-Null
            [IO.File]::WriteAllText('encrypted-transfer/envelope.json',($envelope|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false))
          } finally {
            if ($plain) { [Array]::Clear($plain,0,$plain.Length) }
            $rsa.Dispose()
            $env:UPLOAD_TOKEN=$null
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-mirror-credential
          path: encrypted-transfer/envelope.json
          retention-days: 1
          if-no-files-found: error
