name: mirrorchyan_release_note
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: read
jobs:
  mirrorchyan:
    if: ${{ github.repository == 'kahvia-d/IMAO' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2022
    environment: mirrorchyan
    timeout-minutes: 90
    concurrency:
      group: imao-production-release
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.424
      - name: Verify current stable and synchronize
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MIRRORCHYAN_TOKEN: ${{ secrets.MIRRORCHYANUPLOADTOKEN }}
        run: ./scripts/Sync-CiMirrorChyan.ps1 -Tag $env:TAG -NotesOnly
